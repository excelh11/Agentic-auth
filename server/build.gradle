plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// 필터/핸들러 계층은 @RestController 바깥이라 Jackson 자동 직렬화가 안 걸린다.
	// response.getWriter()에 직접 써야 하므로 Gson으로 수동 직렬화한다.
	implementation 'com.google.code.gson:gson:2.10.1'

	// JWT - api는 컴파일 의존, impl/jackson은 런타임 전용
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.11.5'

	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// K6 — deprecated/unchecked 사용을 눈에 보이게 한다.
// 경고가 안 보이면 "쓰고 있는지 아닌지"를 추측으로 판단하게 된다.
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

tasks.named('test') {
	useJUnitPlatform()
}
